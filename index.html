<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Someone Special</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all 0.5s ease;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #121212;
            color: #f0f0f0;
            overflow: hidden;
            line-height: 1.6;
        }

        .container {
            max-width: 400px;
            padding: 2rem;
            text-align: center;
            position: relative;
        }

        .message-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            padding: 2rem;
            border-radius: 15px;
            margin-bottom: 2rem;
            opacity: 1;
            transform: translateY(0);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .message-box.hidden {
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: none;
            height: 0;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        .second-message {
            opacity: 0;
            transform: translateY(20px);
            height: 0;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        .second-message.visible {
            opacity: 1;
            transform: translateY(0);
            height: auto;
            padding: 2rem;
            margin-bottom: 2rem;
            animation: fadeIn 1s forwards;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #ff9a9e, #fad0c4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .candle-wrapper {
            position: relative;
            margin: 2.5rem auto;
            cursor: pointer;
            width: 80px;
            transition: transform 0.3s;
        }

        .candle-wrapper:hover {
            transform: scale(1.05);
        }

        .candle {
            position: relative;
            width: 30px;
            height: 80px;
            margin: 0 auto;
            background: linear-gradient(to right, #fff0e6, #f7e9e0);
            border-radius: 8px 8px 3px 3px;
            box-shadow: 
                inset -5px 0px 0px #e6d8cf,
                inset 2px -5px 0px #f7e9e0;
            z-index: 2;
        }

        .wax-melt {
            position: absolute;
            width: 100%;
            height: 0;
            bottom: 0;
            background: rgba(255, 200, 150, 0.3);
            border-radius: 0 0 3px 3px;
            transition: height 2s;
        }

        .wick {
            position: absolute;
            width: 3px;
            height: 15px;
            background: #2c2c2c;
            left: 50%;
            transform: translateX(-50%);
            top: -12px;
            z-index: 3;
        }

        .flame {
            position: absolute;
            width: 15px;
            height: 30px;
            background: linear-gradient(180deg, #ff9a00 0%, #ffd700 50%, #ff9a00 100%);
            border-radius: 50% 50% 20% 20%;
            left: 50%;
            transform: translateX(-50%);
            top: -40px;
            opacity: 0;
            filter: blur(2px);
            animation: flicker 0.1s infinite, float 3s ease-in-out infinite;
            z-index: 4;
            box-shadow: 0 0 20px #ff9a00, 0 0 40px #ffd700;
        }

        .glow {
            position: absolute;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(255,218,121,0.4) 0%, rgba(255,218,121,0) 70%);
            left: 50%;
            top: -70px;
            transform: translateX(-50%);
            opacity: 0;
            z-index: 1;
        }

        .light-me {
            color: rgba(255,255,255,0.8);
            margin-top: 15px;
            font-size: 0.9em;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        /* Animations */
        @keyframes flicker {
            0%, 100% { 
                transform: translateX(-50%) scale(1, 1); 
                box-shadow: 0 0 20px #ff9a00, 0 0 40px #ffd700;
            }
            25% { 
                transform: translateX(-50%) scale(0.98, 1.02); 
                box-shadow: 0 0 18px #ff9a00, 0 0 35px #ffd700;
            }
            50% { 
                transform: translateX(-50%) scale(1.02, 0.98); 
                box-shadow: 0 0 22px #ff9a00, 0 0 45px #ffd700;
            }
            75% { 
                transform: translateX(-50%) scale(0.95, 1.05); 
                box-shadow: 0 0 16px #ff9a00, 0 0 30px #ffd700;
            }
        }

        @keyframes float {
            0%, 100% { top: -40px; }
            50% { top: -42px; }
        }

        @keyframes glow-pulse {
            0% { opacity: 0.3; transform: translateX(-50%) scale(1); }
            50% { opacity: 0.6; transform: translateX(-50%) scale(1.1); }
            100% { opacity: 0.3; transform: translateX(-50%) scale(1); }
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Light mode styles */
        .light-mode {
            background: linear-gradient(135deg, #fff3e6, #ffe8d6);
            color: #4a4a4a;
        }

        .light-mode .message-box {
            background: rgba(255, 255, 255, 0.8);
            color: #333;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .light-mode h1 {
            background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .light-mode .candle {
            box-shadow: 
                inset -5px 0px 0px #e6d8cf,
                inset 2px -5px 0px #f7e9e0,
                0 5px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="message-box" id="first-message">
            <h1>For You</h1>
            <p>I wanted to create something beautiful to tell you how special you are.</p>
            <p style="margin-top: 1rem;">Every moment with you feels like magic.</p>
        </div>

        <div class="message-box second-message" id="second-message">
            <h1>You Light Up My Life</h1>
            <p>This is the difference you've made in my life</p>
            <p style="margin-top: 1rem;">You always deserve the best</p>
            <p>Your light makes everything brighter</p>
        </div>

        <div class="candle-wrapper" onclick="lightCandle()">
            <div class="glow"></div>
            <div class="flame"></div>
            <div class="wick"></div>
            <div class="candle">
                <div class="wax-melt"></div>
            </div>
            <p class="light-me">Light me</p>
        </div>
    </div>

    <script>
        function lightCandle() {
            // Prevent multiple clicks
            const candleWrapper = document.querySelector('.candle-wrapper');
            candleWrapper.style.pointerEvents = 'none';
            
            // Light the candle
            document.body.classList.add('light-mode');
            document.querySelector('.flame').style.opacity = '1';
            document.querySelector('.glow').style.opacity = '1';
            document.querySelector('.glow').style.animation = 'glow-pulse 2s infinite';
            document.querySelector('.light-me').style.opacity = '0';
            
            // Melt the wax
            document.querySelector('.wax-melt').style.height = '10px';
            
            // Hide first message and show second message
            setTimeout(() => {
                document.getElementById('first-message').classList.add('hidden');
                document.getElementById('second-message').classList.add('visible');
            }, 800);
            
            // Add subtle ambient animation
            setTimeout(() => {
                document.querySelector('.message-box').style.boxShadow = '0 8px 32px rgba(255, 200, 150, 0.3)';
            }, 1500);
        }
    </script>
</body>
</html>
